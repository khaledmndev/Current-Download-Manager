[package]
name = "current-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
development-pro = ["current-core/development-pro"]

[dependencies]
current-core = { path = "../../crates/current-core" }
anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true

[[bin]]
name = "current-daemon"
