[package]
name = "current-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
development-pro = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks", "system-proxy"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
url = "2"
tokio-util = "0.7"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
